<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор первого экрана</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#14110e; --panel:#1d1915; --line:#332b23; --text:#ece3d6; --muted:#a4968a; --accent:#ff8b3d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .app { display:grid; grid-template-columns:1fr 340px; height:100%; }
  .stage-wrap { position:relative; overflow:hidden; background:#0b0908; }
  .stage { position:absolute; }
  iframe { position:absolute; top:0; left:0; width:1440px; height:900px; border:0;
    transform-origin:0 0; background:#0b0908; }
  .side { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto;
    padding:14px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:12px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .layers { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#241f1a;
    cursor:pointer; font-size:12px; }
  .chip.is-on { border-color:var(--accent); color:#ffd9b8; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
  input[type="number"] { width:100%; padding:6px 8px; border-radius:8px; border:1px solid var(--line);
    background:#12100d; color:var(--text); font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; }
  button { flex:1; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
    background:#241f1a; color:var(--text); cursor:pointer; font-size:12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#21150c; font-weight:600; }
  button.ghost { background:#1b1712; }
  button:hover { filter:brightness(1.12); }
  .hint { color:var(--muted); font-size:11px; line-height:1.5; margin:0; }
  textarea { width:100%; height:120px; border-radius:10px; border:1px solid var(--line);
    background:#12100d; color:#cbbfb0; font:11px/1.4 ui-monospace,Consolas,monospace; padding:8px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2b2119;
    border:1px solid var(--line); color:#ffd9b8; padding:8px 14px; border-radius:999px;
    opacity:0; transition:.25s; pointer-events:none; z-index:99; }
  .toast.is-on { opacity:1; }
  .sep { height:1px; background:var(--line); margin:2px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage">
    <iframe id="frame" src="index.html"></iframe>
  </div></div>

  <aside class="side">
    <h1>Слои</h1>
    <div class="layers" id="chips"></div>
    <div class="sep"></div>
    <div class="fields" id="fields"></div>
    <div class="row">
      <button class="ghost" id="up">Выше</button>
      <button class="ghost" id="down">Ниже</button>
    </div>
    <div class="row">
      <button id="add">Добавить картинку</button>
      <button id="replace">Заменить…</button>
    </div>
    <div class="row">
      <button class="ghost" id="remove">Удалить слой</button>
    </div>
    <p class="hint">Тяни объект — двигается. Уголок — размер. Кружок сверху — поворот (Shift — наклон вперёд,
      Alt — разворот вбок). Стрелки — сдвиг на 0.2%, с Shift — 1%.</p>
    <div class="sep"></div>
    <div class="row">
      <button class="primary" id="save">Скачать JSON</button>
      <button id="copy">Скопировать</button>
    </div>
    <div class="row">
      <button class="ghost" id="reset">Сбросить</button>
      <button class="ghost" id="import">Импорт…</button>
    </div>
    <textarea id="out" readonly></textarea>
  </aside>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileAdd" accept="image/*" multiple hidden>
<input type="file" id="fileReplace" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json" hidden>

<script>
const FIXED = ['exhibit', 'stand', 'main', 'catalog', 'phone', 'copy'];
const PANELS = ['main', 'catalog', 'phone'];
const LABEL = { exhibit:'вся витрина', stand:'стойка', main:'главная', catalog:'каталог', phone:'телефон', copy:'текст' };
const LS_KEY = 'heroLayoutDraftV2';

const DEFAULT = {
  exhibit: { width:64, right:1, bottom:3, rotZ:0 },
  stand:   { scale:1, dx:0, dy:0, brightness:0.78 },
  main:    { left:13, top:7, width:76, rotX:0, rotY:-8, rotZ:-3, z:2 },
  catalog: { left:11, top:34, width:71, rotX:0, rotY:-8, rotZ:-3, z:3 },
  phone:   { left:20, top:57, width:68, rotX:0, rotY:-8, rotZ:-2, z:4 },
  copy:    { left:4.8, top:42, width:38 },
  extra:   []
};

let frame, doc, win, hero, exhibit;
let state = JSON.parse(JSON.stringify(DEFAULT));
let selected = 'main';
let drag = null;

const num = (v, d = 2) => Math.round(v * 10 ** d) / 10 ** d;
const toast = (msg) => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('is-on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('is-on'), 1700);
};
const elForKey = (key) => key.startsWith('x:')
  ? exhibit.querySelector(`[data-extra="${key.slice(2)}"]`)
  : doc.querySelector(`[data-layer="${key}"]`);
const isExtra = (key) => key.startsWith('x:');
const extraOf = (key) => state.extra.find((l) => l.id === key.slice(2));

const t3d = (v) => `perspective(1200px) rotateX(${v.rotX || 0}deg) rotateY(${v.rotY || 0}deg) rotateZ(${v.rotZ || 0}deg)`;

function buildExtras() {
  exhibit.querySelectorAll('[data-extra]').forEach((n) => n.remove());
  state.extra.forEach((layer) => {
    const img = doc.createElement('img');
    img.src = layer.src;
    img.dataset.extra = layer.id;
    img.alt = '';
    Object.assign(img.style, {
      position:'absolute', left:(layer.left ?? 0)+'%', top:(layer.top ?? 0)+'%',
      width:(layer.width ?? 30)+'%', borderRadius:(layer.radius ?? 10)+'px',
      opacity: layer.opacity ?? 1, transform: t3d(layer), zIndex: String(layer.z ?? 5),
      pointerEvents:'none'
    });
    exhibit.appendChild(img);
  });
}

function apply(key) {
  const v = key === 'extra' ? null : state[key];
  if (key === 'extra') { buildExtras(); return; }
  if (isExtra(key)) {
    const layer = extraOf(key);
    const node = elForKey(key);
    if (!layer || !node) return;
    Object.assign(node.style, {
      left: layer.left + '%', top: layer.top + '%', width: layer.width + '%',
      transform: t3d(layer), zIndex: String(layer.z ?? 5), opacity: layer.opacity ?? 1,
      borderRadius: (layer.radius ?? 10) + 'px'
    });
    return;
  }
  const node = elForKey(key);
  if (!node || !v) return;
  if (key === 'exhibit') {
    node.style.width = v.width + '%';
    node.style.right = v.right + '%';
    node.style.bottom = v.bottom + '%';
    node.style.transform = v.rotZ ? `rotate(${v.rotZ}deg)` : '';
  } else if (key === 'copy') {
    node.style.left = v.left + '%'; node.style.top = v.top + '%'; node.style.width = v.width + '%';
  } else if (PANELS.includes(key)) {
    node.style.left = v.left + '%'; node.style.top = v.top + '%'; node.style.width = v.width + '%';
    node.style.transform = t3d(v);
    node.style.zIndex = String(v.z ?? 2);
  } else if (key === 'stand') {
    node.style.transform = `translate(${v.dx || 0}%, ${v.dy || 0}%) scale(${v.scale ?? 1})`;
    node.style.filter = `brightness(${v.brightness ?? 0.78}) drop-shadow(8px 18px 16px rgba(0,0,0,.55))`;
  }
}

function fieldsFor(key) {
  if (isExtra(key)) return [['left','слева, %'],['top','сверху, %'],['width','ширина, %'],['rotZ','поворот, °'],['rotX','наклон, °'],['rotY','разворот, °'],['z','слой'],['opacity','прозрачность']];
  if (key === 'exhibit') return [['width','ширина, %'],['right','справа, %'],['bottom','снизу, %'],['rotZ','поворот, °']];
  if (key === 'copy') return [['left','слева, %'],['top','сверху, %'],['width','ширина, %']];
  if (PANELS.includes(key)) return [['left','слева, %'],['top','сверху, %'],['width','ширина, %'],['rotZ','поворот, °'],['rotX','наклон, °'],['rotY','разворот, °'],['z','слой']];
  if (key === 'stand') return [['scale','масштаб'],['dx','сдвиг X, %'],['dy','сдвиг Y, %'],['brightness','яркость']];
  return [];
}

function renderChips() {
  const host = document.getElementById('chips');
  host.innerHTML = '';
  const keys = [...FIXED, ...state.extra.map((l) => 'x:' + l.id)];
  keys.forEach((key) => {
    const b = document.createElement('button');
    b.className = 'chip' + (key === selected ? ' is-on' : '');
    b.textContent = isExtra(key) ? (extraOf(key)?.label || 'картинка') : LABEL[key];
    b.addEventListener('click', () => select(key));
    host.appendChild(b);
  });
}

function renderFields() {
  const host = document.getElementById('fields');
  host.innerHTML = '';
  const data = isExtra(selected) ? extraOf(selected) : state[selected];
  fieldsFor(selected).forEach(([prop, label]) => {
    const wrap = document.createElement('label');
    wrap.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.step = prop === 'opacity' ? '0.05' : '0.5';
    input.min = prop === 'opacity' ? '0' : '';
    input.max = prop === 'opacity' ? '1' : '';
    input.value = data?.[prop] ?? 0;
    input.addEventListener('input', () => {
      const val = parseFloat(input.value);
      if (!Number.isFinite(val)) return;
      data[prop] = val;
      apply(selected);
      saveDraft();
    });
    wrap.appendChild(input);
    host.appendChild(wrap);
  });
  document.getElementById('remove').disabled = !isExtra(selected);
}

function decorate() {
  doc.querySelectorAll('.ow-handle').forEach((n) => n.remove());
  doc.querySelectorAll('[data-layer],[data-extra]').forEach((n) => {
    n.style.outline = 'none'; n.style.pointerEvents = '';
  });
  const node = elForKey(selected);
  if (!node) return;
  node.style.pointerEvents = 'auto';
  node.style.outline = '1px dashed rgba(255,139,61,.8)';
  node.style.outlineOffset = '2px';
  const mk = (style, mode) => {
    const h = doc.createElement('div');
    h.className = 'ow-handle';
    Object.assign(h.style, {
      position:'absolute', zIndex:9999, width:'14px', height:'14px', borderRadius:'50%',
      background:'#ff8b3d', border:'2px solid #21150c', cursor: mode === 'rotate' ? 'grab' : 'nwse-resize', ...style
    });
    h.dataset.mode = mode;
    node.appendChild(h);
    h.addEventListener('pointerdown', (e) => startDrag(e, mode));
    return h;
  };
  mk({ right:'-7px', bottom:'-7px' }, 'resize');
  mk({ left:'50%', top:'-22px', marginLeft:'-7px' }, 'rotate');
}

function stateOf(key) {
  return isExtra(key) ? extraOf(key) : state[key];
}

function boxFor(key) {
  if (key === 'exhibit' || key === 'copy') return hero.getBoundingClientRect();
  return exhibit.getBoundingClientRect();
}

function startDrag(e, mode) {
  e.preventDefault(); e.stopPropagation();
  const node = elForKey(selected);
  if (!node) return;
  const r = node.getBoundingClientRect();
  drag = {
    mode,
    startX: e.clientX, startY: e.clientY,
    box: boxFor(selected),
    start: JSON.parse(JSON.stringify(stateOf(selected))),
    cx: r.left + r.width / 2, cy: r.top + r.height / 2,
    shift: e.shiftKey, alt: e.altKey
  };
  doc.addEventListener('pointermove', onMove);
  doc.addEventListener('pointerup', stopDrag, { once: true });
}

function onMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;
  const target = stateOf(selected);
  if (!target) return;

  if (drag.mode === 'move') {
    if (selected === 'exhibit') {
      state.exhibit.right = num(drag.start.right - (dx / drag.box.width) * 100);
      state.exhibit.bottom = num(drag.start.bottom - (dy / drag.box.height) * 100);
    } else {
      target.left = num(drag.start.left + (dx / drag.box.width) * 100);
      target.top = num(drag.start.top + (dy / drag.box.height) * 100);
    }
  } else if (drag.mode === 'resize') {
    target.width = num(Math.max(4, drag.start.width + (dx / drag.box.width) * 100));
  } else if (drag.mode === 'rotate') {
    if (e.shiftKey) {
      target.rotX = num((drag.start.rotX ?? 0) + dy * 0.35);
    } else if (e.altKey) {
      target.rotY = num((drag.start.rotY ?? 0) + dx * 0.35);
    } else {
      const ang = (Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) * 180) / Math.PI + 90;
      target.rotZ = num(ang);
    }
  }
  apply(selected);
  renderFields();
  saveDraft();
}

function stopDrag() {
  drag = null;
  doc.removeEventListener('pointermove', onMove);
}

function saveDraft() {
  const text = JSON.stringify(state, null, 2);
  document.getElementById('out').value = text;
  try { localStorage.setItem(LS_KEY, text); } catch (e) {}
}

function select(key) {
  selected = key;
  renderChips(); renderFields(); decorate();
}

function setup() {
  frame = document.getElementById('frame');
  doc = frame.contentDocument;
  win = frame.contentWindow;
  hero = doc.querySelector('.hero');
  exhibit = doc.querySelector('[data-layer="exhibit"]');
  if (!hero || !exhibit) return;

  exhibit.style.pointerEvents = 'auto';
  if (doc.querySelector('[data-layer="copy"]')) doc.querySelector('[data-layer="copy"]').style.pointerEvents = 'none';

  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (draft) { state = { ...state, ...draft }; if (!Array.isArray(state.extra)) state.extra = []; }

  FIXED.forEach((k) => { if (state[k]) apply(k); });
  buildExtras();

  const keys = () => [...FIXED, ...state.extra.map((l) => 'x:' + l.id)];
  keys().forEach((key) => {
    const node = elForKey(key);
    if (!node) return;
    node.addEventListener('pointerdown', (e) => {
      if (e.target.dataset.mode) return;
      select(key);
      startDrag(e, 'move');
    });
  });

  select('main');
  saveDraft();

  doc.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 1 : 0.2;
    const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
    const d = map[e.key];
    if (!d) return;
    const t = stateOf(selected);
    if (!t) return;
    e.preventDefault();
    if (selected === 'exhibit') {
      state.exhibit.right = num(state.exhibit.right - d[0]);
      state.exhibit.bottom = num(state.exhibit.bottom - d[1]);
    } else {
      t.left = num(t.left + d[0]);
      t.top = num(t.top + d[1]);
    }
    apply(selected); renderFields(); saveDraft();
  });
}

function fit() {
  const wrap = document.getElementById('stageWrap');
  const stage = document.getElementById('stage');
  const scale = Math.min(wrap.clientWidth / 1440, wrap.clientHeight / 900);
  document.getElementById('frame').style.transform = `scale(${scale})`;
  stage.style.width = 1440 * scale + 'px';
  stage.style.height = 900 * scale + 'px';
  stage.style.left = (wrap.clientWidth - 1440 * scale) / 2 + 'px';
  stage.style.top = (wrap.clientHeight - 900 * scale) / 2 + 'px';
}

document.getElementById('frame').addEventListener('load', () => setTimeout(setup, 250));
window.addEventListener('resize', fit);
fit();

/* ---- порядок слоёв ---- */
function shiftZ(dir) {
  const t = stateOf(selected);
  if (!t) return;
  const all = [
    ...PANELS.map((k) => state[k]).filter(Boolean),
    ...state.extra
  ].map((l) => l.z ?? 0);
  t.z = num(dir > 0 ? Math.max(...all, 0) + 1 : Math.min(...all, 0) - 1, 0);
  apply(selected); renderFields(); saveDraft();
  toast(dir > 0 ? 'Поднял выше' : 'Опустил ниже');
}
document.getElementById('up').addEventListener('click', () => shiftZ(1));
document.getElementById('down').addEventListener('click', () => shiftZ(-1));

/* ---- добавление и замена картинок ---- */
document.getElementById('add').addEventListener('click', () => document.getElementById('fileAdd').click());
document.getElementById('fileAdd').addEventListener('change', (e) => {
  const files = [...e.target.files];
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = () => {
      const max = Math.max(0, ...[...FIXED.map((k) => state[k]?.z ?? 0), ...state.extra.map((l) => l.z ?? 0)]);
      const layer = {
        id: 'i' + Date.now() + i,
        label: file.name.replace(/\.[^.]+$/, '').slice(0, 22) || 'картинка',
        src: reader.result,
        left: 30, top: 30, width: 30,
        rotX: 0, rotY: 0, rotZ: 0,
        z: max + 1, opacity: 1, radius: 10
      };
      state.extra.push(layer);
      buildExtras();
      select('x:' + layer.id);
      saveDraft();
      bindExtras();
      toast('Добавил: ' + layer.label);
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

function bindExtras() {
  state.extra.forEach((layer) => {
    const node = elForKey('x:' + layer.id);
    if (!node || node.dataset.bound) return;
    node.dataset.bound = '1';
    node.addEventListener('pointerdown', (e) => {
      if (e.target.dataset.mode) return;
      select('x:' + layer.id);
      startDrag(e, 'move');
    });
  });
}

document.getElementById('replace').addEventListener('click', () => document.getElementById('fileReplace').click());
document.getElementById('fileReplace').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    if (isExtra(selected)) {
      extraOf(selected).src = reader.result;
      buildExtras(); bindExtras(); decorate();
    } else if (PANELS.includes(selected)) {
      const inner = elForKey(selected).querySelector('.exhibit-surface > img');
      if (inner) inner.src = reader.result;
      else toast('У этого слоя нет картинки');
    } else {
      toast('Выбери слой с картинкой');
    }
    saveDraft();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('remove').addEventListener('click', () => {
  if (!isExtra(selected)) return toast('Удалять можно только добавленные картинки');
  state.extra = state.extra.filter((l) => 'x:' + l.id !== selected);
  buildExtras(); select('main'); saveDraft();
});

/* ---- файлы ---- */
document.getElementById('save').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hero-layout.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Скачал JSON — пришли его мне');
});

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
    toast('JSON в буфере');
  } catch { toast('Скопируй из поля внизу'); }
});

document.getElementById('reset').addEventListener('click', () => {
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  fetch('assets/hero-layout.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((data) => {
      state = { ...JSON.parse(JSON.stringify(DEFAULT)), ...data };
      if (!Array.isArray(state.extra)) state.extra = [];
      FIXED.forEach((k) => apply(k));
      buildExtras(); bindExtras(); select('main'); saveDraft();
      toast('Вернул к файлу');
    });
});

document.getElementById('import').addEventListener('click', () => document.getElementById('fileJson').click());
document.getElementById('fileJson').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      state = { ...JSON.parse(JSON.stringify(DEFAULT)), ...data };
      if (!Array.isArray(state.extra)) state.extra = [];
      FIXED.forEach((k) => apply(k));
      buildExtras(); bindExtras(); select('main'); saveDraft();
      toast('Раскладка загружена');
    } catch { toast('Не разобрал JSON'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});
</script>
</body>
</html>
