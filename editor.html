<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор первого экрана</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<style>
  :root { --bg:#14110e; --panel:#1d1915; --line:#332b23; --text:#ece3d6; --muted:#a4968a; --accent:#ff8b3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .app { display:grid; grid-template-columns:1fr 350px; height:100%; }
  .stage-wrap { position:relative; overflow:hidden; background:#0b0908; }
  .stage { position:absolute; }
  iframe { position:absolute; top:0; left:0; width:1600px; height:900px; border:0; transform-origin:0 0; background:#0b0908; }
  .side { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto;
    padding:14px; display:flex; flex-direction:column; gap:11px; }
  h1 { font-size:12px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .layers { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#241f1a; cursor:pointer; font-size:12px; }
  .chip.is-on { border-color:var(--accent); color:#ffd9b8; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
  input[type="number"], input[type="text"], textarea { width:100%; padding:6px 8px; border-radius:8px;
    border:1px solid var(--line); background:#12100d; color:var(--text); font-variant-numeric:tabular-nums; }
  textarea { resize:vertical; min-height:52px; }
  .row { display:flex; gap:8px; }
  button { flex:1; padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:#241f1a;
    color:var(--text); cursor:pointer; font-size:12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#21150c; font-weight:600; }
  button.is-on { border-color:var(--accent); color:#ffd9b8; }
  button:hover { filter:brightness(1.12); }
  .hint { color:var(--muted); font-size:11px; line-height:1.5; margin:0; }
  .sep { height:1px; background:var(--line); margin:2px 0; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2b2119;
    border:1px solid var(--line); color:#ffd9b8; padding:8px 14px; border-radius:999px; opacity:0;
    transition:.25s; pointer-events:none; z-index:99; }
  .toast.is-on { opacity:1; }
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage">
    <iframe id="frame" src="about:blank"></iframe>
  </div></div>

  <aside class="side">
    <label style="font-size:11px;color:var(--muted)">как смотреть
      <select id="viewport" style="width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#12100d;color:var(--text)">
        <option value="1600x900">ноутбук 1600×900</option>
        <option value="1920x1080">большой 1920×1080</option>
        <option value="1440x810">узкий 1440×810</option>
        <option value="1366x768">старый 1366×768</option>
      </select>
    </label>
    <h1>Слои</h1>
    <div class="layers" id="chips"></div>
    <div class="fields" id="fields"></div>
    <div class="row">
      <button id="warp">Искажение</button>
      <button id="warpReset">Сброс</button>
      <button id="zup">Выше</button>
      <button id="zdown">Ниже</button>
    </div>
    <div class="row">
      <button id="add">Добавить картинку</button>
      <button id="replace">Заменить…</button>
    </div>
    <div class="row">
      <button class="ghost" id="remove">Удалить слой</button>
    </div>
    <p class="hint">Тяни — двигается. Уголок — размер. Кружок — поворот (Shift — наклон, Alt — разворот).
      «Искажение» — четыре угла, как в фотошопе. Стрелки — сдвиг, Shift — крупнее.</p>
    <div class="sep"></div>
    <h1>Тексты</h1>
    <label>вступление<textarea id="t-intro" rows="3"></textarea></label>
    <label>заголовок, строка 1<input type="text" id="t-l1"></label>
    <label>заголовок, строка 2<input type="text" id="t-l2"></label>
    <label>кнопка<input type="text" id="t-cta"></label>
    <label>подпись<textarea id="t-facts" rows="2"></textarea></label>
    <div class="row"><button id="inlineText">Править текст на странице</button></div>
    <div class="sep"></div>
    <div class="row">
      <button class="primary" id="save">Скачать JSON</button>
      <button id="copy">Скопировать</button>
    </div>
    <div class="row">
      <button id="reset">Сбросить</button>
      <button id="import">Импорт…</button>
    </div>
    <textarea id="out" readonly style="height:110px"></textarea>
  </aside>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileAdd" accept="image/*" multiple hidden>
<input type="file" id="fileReplace" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json" hidden>

<script>
  (function () {
    var s = document.createElement('script');
    s.src = 'editor-app.js?t=' + Date.now();
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
