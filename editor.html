<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор первого экрана</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #14110e;
    --panel: #1d1915;
    --line: #332b23;
    --text: #ece3d6;
    --muted: #a4968a;
    --accent: #ff8b3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
  .stage-wrap { position: relative; overflow: hidden; background: #0b0908; }
  .stage { position: absolute; inset: 0; }
  iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px;
    border: 0; transform-origin: 0 0; background: #0b0908; }
  .side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
    padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 14px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .layers { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: #241f1a; cursor: pointer; font-size: 12px; }
  .chip.is-on { border-color: var(--accent); color: #ffd9b8; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
  input[type="number"] { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: #12100d; color: var(--text); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: #241f1a; color: var(--text); cursor: pointer; font-size: 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #21150c; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
  textarea { width: 100%; height: 130px; border-radius: 10px; border: 1px solid var(--line);
    background: #12100d; color: #cbbfb0; font: 11px/1.4 ui-monospace, Consolas, monospace; padding: 8px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #2b2119; border: 1px solid var(--line); color: #ffd9b8; padding: 8px 14px;
    border-radius: 999px; opacity: 0; transition: .25s; pointer-events: none; }
  .toast.is-on { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <iframe id="frame" src="index.html"></iframe>
    </div>
  </div>

  <aside class="side">
    <h1>Слои</h1>
    <div class="layers" id="chips"></div>
    <div class="fields" id="fields"></div>
    <p class="hint">Тяни объект мышкой, уголок — размер, кружок сверху — поворот.
      Стрелки — сдвиг на 0.2%, со Shift — на 1%.</p>
    <div class="row">
      <button class="primary" id="save">Скачать JSON</button>
      <button id="copy">Скопировать</button>
    </div>
    <div class="row">
      <button id="reset">Сбросить к файлу</button>
      <button id="import">Импорт…</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <textarea id="out" readonly></textarea>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const LAYER_KEYS = ['exhibit', 'stand', 'main', 'catalog', 'phone', 'copy'];
const PANELS = ['main', 'catalog', 'phone'];
const LABEL = {
  exhibit: 'вся витрина', stand: 'стойка', main: 'главная',
  catalog: 'каталог', phone: 'телефон', copy: 'текст'
};

let frame, doc, hero;
let state = {};
let selected = 'main';
let fileLayout = null;
const LS_KEY = 'heroLayoutDraft';

const toast = (msg) => {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('is-on'), 1600);
};

const num = (v, d = 2) => Math.round(v * 10 ** d) / 10 ** d;
const el = (key) => doc.querySelector(`[data-layer="${key}"]`);

function measure(key) {
  const node = el(key);
  if (!node) return {};
  const hb = hero.getBoundingClientRect();
  const r = node.getBoundingClientRect();
  if (key === 'exhibit') {
    return {
      width: num((r.width / hb.width) * 100),
      right: num(((hb.right - r.right) / hb.width) * 100),
      bottom: num(((hb.bottom - r.bottom) / hb.height) * 100),
      rot: state.exhibit?.rot ?? 0
    };
  }
  if (key === 'copy') {
    return {
      left: num(((r.left - hb.left) / hb.width) * 100),
      top: num(((r.top - hb.top) / hb.height) * 100),
      width: num((r.width / hb.width) * 100)
    };
  }
  if (PANELS.includes(key)) {
    const eb = el('exhibit').getBoundingClientRect();
    return {
      left: num(((r.left - eb.left) / eb.width) * 100),
      top: num(((r.top - eb.top) / eb.height) * 100),
      width: num((r.width / eb.width) * 100),
      rotZ: state[key]?.rotZ ?? 0,
      rotY: state[key]?.rotY ?? 0
    };
  }
  if (key === 'stand') {
    return { ...(state.stand || { scale: 1, dx: 0, dy: 0, brightness: 0.78 }) };
  }
  return {};
}

function apply(key) {
  const node = el(key);
  if (!node) return;
  const v = state[key] || {};
  if (key === 'exhibit') {
    node.style.width = v.width + '%';
    node.style.right = v.right + '%';
    node.style.bottom = v.bottom + '%';
    node.style.transform = v.rot ? `rotate(${v.rot}deg)` : '';
  } else if (key === 'copy') {
    node.style.left = v.left + '%';
    node.style.top = v.top + '%';
    node.style.width = v.width + '%';
  } else if (PANELS.includes(key)) {
    node.style.left = v.left + '%';
    node.style.top = v.top + '%';
    node.style.width = v.width + '%';
    node.style.transform = `perspective(1200px) rotateY(${v.rotY || 0}deg) rotateZ(${v.rotZ || 0}deg)`;
  } else if (key === 'stand') {
    node.style.transform = `translate(${v.dx || 0}%, ${v.dy || 0}%) scale(${v.scale || 1})`;
    node.style.filter = `brightness(${v.brightness ?? 0.78}) drop-shadow(8px 18px 16px rgba(0,0,0,.55))`;
  }
}

function fieldsFor(key) {
  if (key === 'exhibit') return [['width', 'ширина, %'], ['right', 'справа, %'], ['bottom', 'снизу, %'], ['rot', 'поворот, °']];
  if (key === 'copy') return [['left', 'слева, %'], ['top', 'сверху, %'], ['width', 'ширина, %']];
  if (PANELS.includes(key)) return [['left', 'слева, %'], ['top', 'сверху, %'], ['width', 'ширина, %'], ['rotZ', 'наклон, °'], ['rotY', 'разворот, °']];
  if (key === 'stand') return [['scale', 'масштаб'], ['dx', 'сдвиг X, %'], ['dy', 'сдвиг Y, %'], ['brightness', 'яркость']];
  return [];
}

function renderFields() {
  const host = document.getElementById('fields');
  host.innerHTML = '';
  fieldsFor(selected).forEach(([prop, label]) => {
    const wrap = document.createElement('label');
    wrap.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.5';
    input.value = state[selected]?.[prop] ?? 0;
    input.addEventListener('input', () => {
      const val = parseFloat(input.value);
      if (Number.isFinite(val)) {
        state[selected][prop] = val;
        apply(selected);
        refreshOut();
      }
    });
    wrap.appendChild(input);
    host.appendChild(wrap);
  });
}

function renderChips() {
  const host = document.getElementById('chips');
  host.innerHTML = '';
  LAYER_KEYS.forEach((key) => {
    const b = document.createElement('button');
    b.className = 'chip' + (key === selected ? ' is-on' : '');
    b.textContent = LABEL[key];
    b.addEventListener('click', () => select(key));
    host.appendChild(b);
  });
}

function refreshOut() {
  const text = JSON.stringify(state, null, 2);
  document.getElementById('out').value = text;
  try { localStorage.setItem(LS_KEY, text); } catch (e) {}
}

function select(key) {
  selected = key;
  renderChips();
  renderFields();
  decorate();
}

/* ---------- ручки в iframe ---------- */
function decorate() {
  doc.querySelectorAll('.ow-handle, .ow-frame').forEach((n) => n.remove());
  doc.querySelectorAll('[data-layer]').forEach((n) => {
    n.style.outline = 'none';
    n.style.pointerEvents = '';
  });
  const node = el(selected);
  if (!node) return;
  node.style.pointerEvents = 'auto';
  node.style.outline = '1px dashed rgba(255,139,61,.75)';
  node.style.outlineOffset = '2px';

  const mk = (cls, style, mode) => {
    const h = doc.createElement('div');
    h.className = 'ow-handle';
    Object.assign(h.style, {
      position: 'absolute', zIndex: 999, borderRadius: '50%', background: '#ff8b3d',
      border: '2px solid #21150c', width: '14px', height: '14px', cursor: mode === 'rotate' ? 'grab' : 'nwse-resize',
      ...style
    });
    h.dataset.mode = mode;
    node.appendChild(h);
    h.addEventListener('pointerdown', (e) => startDrag(e, mode));
    return h;
  };
  mk('resize', { right: '-7px', bottom: '-7px' }, 'resize');
  mk('rotate', { left: '50%', top: '-22px', marginLeft: '-7px', cursor: 'grab' }, 'rotate');
}

let drag = null;

function startDrag(e, mode) {
  e.preventDefault();
  e.stopPropagation();
  const node = el(selected);
  const r = node.getBoundingClientRect();
  const hb = hero.getBoundingClientRect();
  const eb = el('exhibit').getBoundingClientRect();
  const base = PANELS.includes(selected) ? eb : hb;
  drag = {
    mode,
    startX: e.clientX,
    startY: e.clientY,
    box: base,
    rect: r,
    start: JSON.parse(JSON.stringify(state[selected])),
    cx: r.left + r.width / 2,
    cy: r.top + r.height / 2
  };
  doc.addEventListener('pointermove', onPointerMove);
  doc.addEventListener('pointerup', stopDrag, { once: true });
}

function onPointerMove(e) {
  if (!drag) return;
  const dxPx = e.clientX - drag.startX;
  const dyPx = e.clientY - drag.startY;

  if (drag.mode === 'move') {
    if (selected === 'exhibit') {
      state.exhibit.right = num(drag.start.right - (dxPx / drag.box.width) * 100);
      state.exhibit.bottom = num(drag.start.bottom - (dyPx / drag.box.height) * 100);
    } else {
      state[selected].left = num(drag.start.left + (dxPx / drag.box.width) * 100);
      state[selected].top = num(drag.start.top + (dyPx / drag.box.height) * 100);
    }
  } else if (drag.mode === 'resize') {
    const w = drag.start.width + (dxPx / drag.box.width) * 100;
    state[selected].width = num(Math.max(6, w));
  } else if (drag.mode === 'rotate') {
    const ang = (Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) * 180) / Math.PI + 90;
    if (PANELS.includes(selected)) state[selected].rotZ = num(ang);
    else if (selected === 'exhibit') state.exhibit.rot = num(ang);
  }
  apply(selected);
  renderFields();
  refreshOut();
}

function stopDrag() {
  drag = null;
  doc.removeEventListener('pointermove', onPointerMove);
}

function setup() {
  frame = document.getElementById('frame');
  doc = frame.contentDocument;
  hero = doc.querySelector('.hero');
  if (!hero) return;

  const exhibit = el('exhibit');
  if (exhibit) exhibit.style.pointerEvents = 'auto';

  // начальное состояние: повороты — из файла, геометрия — измеренная
  state = {};
  LAYER_KEYS.forEach((key) => {
    state[key] = measure(key);
    if (key === 'stand') state.stand = state.stand || { scale: 1, dx: 0, dy: 0, brightness: 0.78 };
    apply(key);
  });
  if (fileLayout) {
    LAYER_KEYS.forEach((key) => {
      if (fileLayout[key]) state[key] = { ...state[key], ...fileLayout[key] };
      apply(key);
    });
  }

  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (draft) {
    LAYER_KEYS.forEach((key) => {
      if (draft[key]) state[key] = { ...(state[key] || {}), ...draft[key] };
      apply(key);
    });
    toast('Черновик восстановлен');
  }

  renderChips();
  renderFields();
  decorate();
  refreshOut();

  LAYER_KEYS.forEach((key) => {
    const node = el(key);
    if (!node) return;
    node.addEventListener('pointerdown', (e) => {
      if (e.target.dataset.mode) return;
      select(key);
      startDrag(e, 'move');
    });
  });

  doc.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 1 : 0.2;
    const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    const d = map[e.key];
    if (!d || !state[selected]) return;
    e.preventDefault();
    if (selected === 'exhibit') {
      state.exhibit.right = num(state.exhibit.right - d[0]);
      state.exhibit.bottom = num(state.exhibit.bottom - d[1]);
    } else if (PANELS.includes(selected) || selected === 'copy') {
      state[selected].left = num(state[selected].left + d[0]);
      state[selected].top = num(state[selected].top + d[1]);
    }
    apply(selected);
    renderFields();
    refreshOut();
  });
}

function fit() {
  const wrap = document.getElementById('stageWrap');
  const stage = document.getElementById('stage');
  const scale = Math.min(wrap.clientWidth / 1440, wrap.clientHeight / 900);
  const f = document.getElementById('frame');
  f.style.transform = `scale(${scale})`;
  stage.style.width = 1440 * scale + 'px';
  stage.style.height = 900 * scale + 'px';
  stage.style.left = (wrap.clientWidth - 1440 * scale) / 2 + 'px';
  stage.style.top = (wrap.clientHeight - 900 * scale) / 2 + 'px';
  stage.style.inset = 'auto';
}

document.getElementById('frame').addEventListener('load', () => {
  setTimeout(setup, 250);
});
window.addEventListener('resize', fit);
fit();

document.getElementById('save').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hero-layout.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Файл скачан — пришли его мне, я закоммичу');
});

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
    toast('JSON в буфере обмена');
  } catch {
    document.getElementById('out').select();
    toast('Скопируй из поля внизу');
  }
});

document.getElementById('reset').addEventListener('click', () => {
  fetch('assets/hero-layout.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((data) => {
      fileLayout = data;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      LAYER_KEYS.forEach((key) => {
        if (data[key]) state[key] = { ...(state[key] || {}), ...data[key] };
        apply(key);
      });
      renderFields();
      refreshOut();
      toast('Вернул значения из файла');
    });
});

document.getElementById('import').addEventListener('click', () => {
  document.getElementById('file').click();
});
document.getElementById('file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      fileLayout = JSON.parse(reader.result);
      LAYER_KEYS.forEach((key) => {
        if (fileLayout[key]) state[key] = { ...(state[key] || {}), ...fileLayout[key] };
        apply(key);
      });
      renderFields();
      refreshOut();
      toast('Раскладка загружена');
    } catch {
      toast('Не получилось разобрать JSON');
    }
  };
  reader.readAsText(file);
});
</script>
</body>
</html>
